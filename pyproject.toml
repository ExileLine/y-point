[project]
name = "y-point"
version = "0.1.0"
description = "Project scaffold generated by init_fastapi_project.sh"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler>=3.10.4",
  "httpx>=0.27.2",
  "bcrypt>=4.2.0",
  "celery>=5.4.0",
  "fastapi>=0.115.0",
  "loguru>=0.7.2",
  "pydantic-settings>=2.5.2",
  "python-dateutil>=2.9.0.post0",
  "pytz>=2024.1",
  "redis>=5.0.8",
  "shortuuid>=1.0.13",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncmy>=0.2.9",
  "asyncpg>=0.30.0",
  "uvicorn[standard]>=0.30.6",
  "email-validator>=2.3.0",
  "deepagents==0.7.29",
  "pyjwt>=2.10,<3",
  "cryptography>=50.0.2",
  "langchain-openai>=1.7.2",
  "langchain-anthropic>=1.7.6",
  "langchain-google-genai>=2.1",
  "langchain-aws>=1.0",
  "langgraph-checkpoint-sqlite>=3.0.0,<4",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.40,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "reportlab>=5.1.0",
  "markdown>=3.11.2",
  "bleach>=6.4.0",
  "pypdf>=6.21.2",
  "pillow>=13,<14",
]

[dependency-groups]
dev = [
  "alembic>=1.14.1",
  "pytest>=8.3.2",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
