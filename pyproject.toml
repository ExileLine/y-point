# 项目安装、依赖、命令入口和工具配置的统一清单；逐项说明见 docs/cli.md。
[project]
# 标准项目元数据；name 是安装标识，version 是发布版本。
name = "y-point"
version = "0.1.0"
description = "Y-Point Agent 工作台与开发部署命令"
readme = "README.md"
# 允许使用本项目的 Python 版本范围。
requires-python = ">=3.12"

# 应用运行依赖；ypoint_cli 自身只导入标准库，源码模块入口不需要安装此列表。
dependencies = [
  "alembic>=1.14.1",
  "anyio>=4.5,<5",
  "apscheduler>=3.10.4",
  "httpx>=0.27.2",
  "bcrypt>=4.2.0",
  "celery>=5.4.0",
  "fastapi>=0.115.0",
  "loguru>=0.7.2",
  "pydantic-settings>=2.5.2",
  "python-dateutil>=2.9.0.post0",
  "pytz>=2024.1",
  "redis>=5.0.8",
  "shortuuid>=1.0.13",
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20.0",
  "asyncmy>=0.2.9",
  "asyncpg>=0.30.0",
  "uvicorn[standard]>=0.30.6",
  "email-validator>=2.3.0",
  "deepagents==0.7.29",
  "pyjwt>=2.10,<3",
  "cryptography>=50.0.2",
  "langchain-openai>=1.7.2",
  "langchain-anthropic>=1.7.6",
  "langchain-google-genai>=2.1",
  "langchain-aws>=1.0",
  "langgraph-checkpoint-sqlite>=3.0.0,<4",
  "python-multipart>=0.0.20,<1",
  "boto3>=1.40,<2",
  "langgraph-checkpoint-postgres>=3.2,<4",
  "psycopg[binary]>=3.2,<4",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2,<2",
  "openpyxl>=3.1.5",
  "reportlab>=5.1.0",
  "markdown>=3.11.2",
  "bleach>=6.4.0",
  "pypdf>=6.21.2",
  "pillow>=13,<14",
  "pyyaml>=6,<7",
  "mcp>=1.30.0,<2",
  "jsonschema>=4.0,<5",
  "packaging>=24,<27",
  "docxtpl>=0.20,<0.21",
  "pdfplumber>=0.11.10,<0.12",
  "pypdfium2>=5.15,<6",
  "ag-ui-protocol==1.0.0",
]

# 安装项目时生成 yp 可执行命令；冒号左侧为模块路径，右侧为入口函数。
[project.scripts]
yp = "ypoint_cli.main:main"

# 开发依赖单独管理，不进入生产依赖安装。
[dependency-groups]
dev = [
  "pytest>=8.3.2",
]

# uv 专属设置：安装项目自身，才能生成 [project.scripts] 声明的命令。
[tool.uv]
package = true

# Python 标准构建配置：由 setuptools 生成 wheel 和可编辑安装元数据。
[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# 明确打包边界，避免自动发现 deploy、sandbox、docs 等顶层目录。
[tool.setuptools.packages.find]
include = ["app", "app.*", "ypoint_cli", "ypoint_cli.*"]
namespaces = false

# Ruff 的代码检查与格式化配置；不影响应用运行和命令参数。
[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "E501"]

[tool.ruff.format]
skip-magic-trailing-comma = false
